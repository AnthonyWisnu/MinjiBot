<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connect Four // MinjiBot Strategy Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      background-color: #0b0e14;
      background-image: radial-gradient(circle at 50% 0%, #162432 0%, #0b0e14 65%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #141924;
      border: 1px solid #222b3d;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: #00F0FF;
      letter-spacing: 1px;
      font-family: 'JetBrains Mono', monospace;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
    }
    .status-badge {
      background: #1c2638;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 10px;
      border-radius: 9999px;
    }

    /* Connect Four Grid (7 cols x 6 rows) */
    .c4-board-wrapper {
      background: #1e3a8a;
      border: 3px solid #1d4ed8;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.2);
    }
    .c4-columns {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .c4-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      border-radius: 10px;
      padding: 2px;
      transition: background-color 0.15s;
    }
    .c4-col:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .c4-slot {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #090d16;
      border-radius: 50%;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chip {
      width: 90%;
      height: 90%;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .chip.p1 {
      background: radial-gradient(circle at 35% 35%, #fbbf24 0%, #d97706 80%);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }
    .chip.p2 {
      background: radial-gradient(circle at 35% 35%, #38bdf8 0%, #0284c7 80%);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    .chip.win {
      animation: pulseWin 0.6s infinite alternate;
    }
    @keyframes pulseWin {
      from { transform: scale(0.9); filter: brightness(1); }
      to { transform: scale(1.1); filter: brightness(1.5); }
    }

    /* Controls & Options */
    .options-card {
      background: #11151c;
      border: 1px solid #1f2634;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
    }
    .btn-group { display: flex; gap: 6px; }
    .opt-btn {
      background: #181d27;
      border: 1px solid #293245;
      color: #cbd5e1;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .opt-btn.active {
      background: #00F0FF;
      border-color: #00F0FF;
      color: #0b0e14;
      font-weight: 800;
    }
    .btn-action {
      flex: 1;
      background: #181d28;
      border: 1px solid #2a3447;
      color: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-action.primary {
      background: #00F0FF;
      border-color: #00F0FF;
      color: #0b0e14;
      font-weight: 800;
    }

    /* Nav bar */
    .duel-nav { display: flex; gap: 8px; }
    .duel-link {
      flex: 1;
      background: #12161f;
      border: 1px solid #202737;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
    }
    .duel-link.active {
      border-color: #00F0FF;
      color: #00F0FF;
      background: #0d1e2e;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #161c27;
      border: 1px solid #00F0FF;
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      z-index: 100;
      opacity: 0;
      transition: all 0.3s;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <div>
          <div class="brand-sub">STRATEGY ARENA</div>
          <div class="brand-title">Connect Four</div>
        </div>
        <div class="status-badge" id="c4-status">Giliran Kuning (P1)</div>
      </div>

      <!-- 7x6 Connect Four Board -->
      <div class="c4-board-wrapper">
        <div class="c4-columns" id="c4-grid">
          <!-- 7 Columns injected via JS -->
        </div>
      </div>
    </div>

    <!-- Options Card -->
    <div class="options-card">
      <div class="option-row">
        <span>MODE PERMAINAN:</span>
        <div class="btn-group">
          <button class="opt-btn active" id="btn-ai" onclick="setC4Mode('ai')">LAWAN BOT</button>
          <button class="opt-btn" id="btn-pvp" onclick="setC4Mode('pvp')">PASS & PLAY</button>
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-action primary" onclick="resetC4()">GAME BARU</button>
        <button class="btn-action" onclick="claimC4Token()">KLAIM TOKEN</button>
      </div>
    </div>

    <!-- Duel Hub Switcher -->
    <div class="duel-nav">
      <a href="/catur" class="duel-link">CATUR FIDE</a>
      <a href="/duel/connect4" class="duel-link active">CONNECT FOUR</a>
      <a href="/duel/tictactoe" class="duel-link">TIC-TAC-TOE</a>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const ROWS = 6;
    const COLS = 7;
    let board = [];
    let currentPlayer = 1; // 1 = Yellow, 2 = Cyan
    let c4Mode = 'ai';
    let isGameOver = false;

    // Audio SFX
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSfx(freq, dur = 0.08) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'show';
      setTimeout(() => toast.className = '', 3000);
    }

    function resetC4() {
      board = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
      currentPlayer = 1;
      isGameOver = false;
      updateC4Status();
      renderC4();
    }

    function setC4Mode(m) {
      c4Mode = m;
      document.getElementById('btn-ai').classList.toggle('active', m === 'ai');
      document.getElementById('btn-pvp').classList.toggle('active', m === 'pvp');
      resetC4();
    }

    function updateC4Status(winPlayer = 0) {
      const el = document.getElementById('c4-status');
      if (winPlayer) {
        el.textContent = winPlayer === 1 ? 'KUNING MENANG!' : (c4Mode === 'ai' ? 'BOT MENANG!' : 'CYAN MENANG!');
        el.style.color = winPlayer === 1 ? '#fbbf24' : '#38bdf8';
        playSfx(880, 0.4);
      } else if (isGameOver) {
        el.textContent = 'PERMAINAN SERI!';
        el.style.color = '#94a3b8';
      } else {
        el.textContent = currentPlayer === 1 ? 'Giliran Kuning' : (c4Mode === 'ai' ? 'Bot berpikir...' : 'Giliran Cyan');
        el.style.color = currentPlayer === 1 ? '#fbbf24' : '#38bdf8';
      }
    }

    function renderC4(winningCoords = []) {
      const gridEl = document.getElementById('c4-grid');
      gridEl.innerHTML = '';

      for (let c = 0; c < COLS; c++) {
        const colEl = document.createElement('div');
        colEl.className = 'c4-col';
        colEl.onclick = () => dropPiece(c);

        for (let r = 0; r < ROWS; r++) {
          const slotEl = document.createElement('div');
          slotEl.className = 'c4-slot';

          const val = board[r][c];
          if (val > 0) {
            const chip = document.createElement('div');
            chip.className = `chip p${val}`;
            if (winningCoords.some(coord => coord.r === r && coord.c === c)) {
              chip.classList.add('win');
            }
            slotEl.appendChild(chip);
          }
          colEl.appendChild(slotEl);
        }
        gridEl.appendChild(colEl);
      }
    }

    function dropPiece(col) {
      if (isGameOver) return;
      if (c4Mode === 'ai' && currentPlayer === 2) return;

      // Find lowest empty row in col
      let targetRow = -1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][col] === 0) {
          targetRow = r;
          break;
        }
      }
      if (targetRow === -1) return; // Column full

      board[targetRow][col] = currentPlayer;
      playSfx(currentPlayer === 1 ? 440 : 330, 0.1);

      const winCoords = checkWin(targetRow, col, currentPlayer);
      if (winCoords) {
        isGameOver = true;
        updateC4Status(currentPlayer);
        renderC4(winCoords);
        return;
      }

      if (board.every(row => row.every(cell => cell > 0))) {
        isGameOver = true;
        updateC4Status();
        renderC4();
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateC4Status();
      renderC4();

      if (c4Mode === 'ai' && currentPlayer === 2 && !isGameOver) {
        setTimeout(makeBotMove, 400);
      }
    }

    function makeBotMove() {
      if (isGameOver) return;

      // 1. Can bot win in 1 move?
      for (let c = 0; c < COLS; c++) {
        const r = getLowestRow(c);
        if (r !== -1) {
          board[r][c] = 2;
          if (checkWin(r, c, 2)) {
            board[r][c] = 0;
            executeBotDrop(c);
            return;
          }
          board[r][c] = 0;
        }
      }

      // 2. Can player win in 1 move? Block them!
      for (let c = 0; c < COLS; c++) {
        const r = getLowestRow(c);
        if (r !== -1) {
          board[r][c] = 1;
          if (checkWin(r, c, 1)) {
            board[r][c] = 0;
            executeBotDrop(c);
            return;
          }
          board[r][c] = 0;
        }
      }

      // 3. Center preference
      const preferences = [3, 2, 4, 1, 5, 0, 6];
      for (const c of preferences) {
        if (getLowestRow(c) !== -1) {
          executeBotDrop(c);
          return;
        }
      }
    }

    function getLowestRow(col) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][col] === 0) return r;
      }
      return -1;
    }

    function executeBotDrop(col) {
      const r = getLowestRow(col);
      if (r === -1) return;

      board[r][col] = 2;
      playSfx(330, 0.1);

      const winCoords = checkWin(r, col, 2);
      if (winCoords) {
        isGameOver = true;
        updateC4Status(2);
        renderC4(winCoords);
        return;
      }

      currentPlayer = 1;
      updateC4Status();
      renderC4();
    }

    function checkWin(r, c, p) {
      const directions = [
        [0, 1],  // Horizontal
        [1, 0],  // Vertical
        [1, 1],  // Diagonal \
        [1, -1]  // Diagonal /
      ];

      for (const [dr, dc] of directions) {
        let coords = [{ r, c }];

        // Check forward
        let nr = r + dr;
        let nc = c + dc;
        while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === p) {
          coords.push({ r: nr, c: nc });
          nr += dr;
          nc += dc;
        }

        // Check backward
        nr = r - dr;
        nc = c - dc;
        while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === p) {
          coords.push({ r: nr, c: nc });
          nr -= dr;
          nc -= dc;
        }

        if (coords.length >= 4) {
          return coords;
        }
      }
      return null;
    }

    function claimC4Token() {
      const token = "C4-" + (isGameOver ? "WIN" : "PLAY") + "-" + Math.floor(Date.now() / 1000).toString(16);
      showToast("Token Connect Four: " + token + " (Kirim ke WhatsApp MinjiBot)");
    }

    resetC4();
  </script>
</body>
</html>
