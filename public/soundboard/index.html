<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MinjiBot Meme Soundboard // VN Dispatcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0d11;
      background-image: radial-gradient(circle at 50% 0%, #152219 0%, #0b0d11 60%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #14171f;
      border: 1px solid #232733;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.85);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1DB954;
      box-shadow: 0 0 8px #1DB954;
    }
    .status-badge {
      background: #0f2918;
      border: 1px solid #1DB954;
      color: #1DB954;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .target-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0c0e13;
      border: 1px solid #262c3a;
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 11px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
    }
    .target-bar input {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      flex: 1;
      outline: none;
    }
    .target-bar input::placeholder {
      color: #475569;
    }

    /* Waveform visualizer banner */
    .visualizer-box {
      background: #090a0e;
      border: 1px solid #1e232d;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .visualizer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
    }
    .visualizer-title {
      color: #1DB954;
      font-weight: 700;
    }
    canvas#audio-wave {
      width: 100%;
      height: 48px;
      display: block;
      border-radius: 6px;
    }

    /* Search and Filters */
    .search-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .search-input {
      flex: 1;
      background: #0d0f14;
      border: 1px solid #242937;
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .search-input:focus {
      border-color: #1DB954;
    }
    .category-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-chip {
      background: #181c25;
      border: 1px solid #282f40;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-chip.active {
      background: #1DB954;
      border-color: #1DB954;
      color: #0b0d11;
      box-shadow: 0 0 10px rgba(29, 185, 84, 0.4);
    }

    /* Sound Grid */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (max-width: 360px) {
      .sound-grid { grid-template-columns: 1fr; }
    }
    .sound-card {
      background: #10131b;
      border: 1px solid #1f2533;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      transition: border-color 0.2s, transform 0.15s;
    }
    .sound-card:hover {
      border-color: #334155;
      transform: translateY(-2px);
    }
    .sound-card.playing {
      border-color: #1DB954;
      box-shadow: 0 0 14px rgba(29, 185, 84, 0.25);
    }
    .sound-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sound-badge {
      font-size: 9px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e293b;
      color: #93c5fd;
      border: 1px solid #3b82f6;
    }
    .sound-duration {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
    }
    .sound-title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.25;
    }
    .sound-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.35;
      height: 30px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .sound-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-preview {
      flex: 1;
      background: #181d29;
      border: 1px solid #2b3345;
      color: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      padding: 8px 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-preview:hover {
      background: #232a3b;
      border-color: #475569;
    }
    .btn-preview.active {
      background: #0f2918;
      border-color: #1DB954;
      color: #1DB954;
    }
    .btn-send-wa {
      background: #1DB954;
      border: none;
      color: #0b0d11;
      font-size: 11px;
      font-weight: 800;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-send-wa:hover {
      background: #1ed760;
    }
    .btn-send-wa:active {
      transform: scale(0.96);
    }
    .btn-send-wa:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Feedback Toast */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #14171f;
      border: 1px solid #1DB954;
      color: #f8fafc;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      opacity: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 90%;
      text-align: center;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    #toast.error {
      border-color: #ef4444;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header Card -->
    <div class="card">
      <div class="header-row">
        <div class="brand-title">
          <div class="brand-dot"></div>
          <span>MINJIBOT MEME SOUNDBOARD</span>
        </div>
        <div class="status-badge" id="bot-status">VN READY</div>
      </div>
      <p style="font-size: 11px; color: #94a3b8; margin-top: 2px;">
        Putar efek suara instan & kirimkan langsung sebagai Voice Note ke WhatsApp.
      </p>

      <!-- Target Chat JID config -->
      <div class="target-bar">
        <span>DESTINASI:</span>
        <input type="text" id="target-chat" placeholder="Masukkan JID grup / chat (cth: 628xxx@s.whatsapp.net)">
      </div>
    </div>

    <!-- Live Audio Visualizer Banner -->
    <div class="visualizer-box">
      <div class="visualizer-header">
        <span>STATUS PREVIEW: <span class="visualizer-title" id="now-playing-label">IDLE</span></span>
        <span id="audio-time">0.0s / 0.0s</span>
      </div>
      <canvas id="audio-wave"></canvas>
    </div>

    <!-- Filter & Search Card -->
    <div class="card" style="padding: 12px;">
      <div class="search-row">
        <input type="text" id="sound-search" class="search-input" placeholder="Cari nama efek suara (cth: vine, bruh, horn)...">
      </div>
      <div class="category-scroll" style="margin-top: 8px;">
        <button class="cat-chip active" data-cat="all">SEMUA</button>
        <button class="cat-chip" data-cat="meme">MEME</button>
        <button class="cat-chip" data-cat="gaming">GAMING</button>
        <button class="cat-chip" data-cat="sfx">SFX</button>
        <button class="cat-chip" data-cat="reaction">REACTION</button>
      </div>
    </div>

    <!-- Sound Catalog Grid -->
    <div class="sound-grid" id="sounds-container">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <script>
    // State
    let sounds = [];
    let activeCategory = 'all';
    let searchQuery = '';
    let currentPlayingId = null;
    let audioContext = null;
    let currentAudio = null;
    let analyserNode = null;
    let animFrameId = null;

    // Elements
    const containerEl = document.getElementById('sounds-container');
    const searchEl = document.getElementById('sound-search');
    const targetChatEl = document.getElementById('target-chat');
    const nowPlayingEl = document.getElementById('now-playing-label');
    const audioTimeEl = document.getElementById('audio-time');
    const canvasEl = document.getElementById('audio-wave');
    const canvasCtx = canvasEl.getContext('2d');
    const toastEl = document.getElementById('toast');

    // Parse URL params (e.g. ?chat=12345@g.us)
    const urlParams = new URLSearchParams(window.location.search);
    const chatFromUrl = urlParams.get('chat');
    if (chatFromUrl) {
      targetChatEl.value = chatFromUrl;
    }

    // Init Canvas resolution
    function resizeCanvas() {
      canvasEl.width = canvasEl.offsetWidth * (window.devicePixelRatio || 1);
      canvasEl.height = canvasEl.offsetHeight * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Show Toast
    let toastTimeout = null;
    function showToast(msg, isError = false) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastEl.textContent = msg;
      toastEl.className = isError ? 'show error' : 'show';
      toastTimeout = setTimeout(() => {
        toastEl.className = '';
      }, 3500);
    }

    // Load Catalog
    async function loadCatalog() {
      try {
        const res = await fetch('/api/soundboard/list');
        const data = await res.json();
        if (data.success && data.sounds) {
          sounds = data.sounds;
          renderGrid();
        } else {
          showToast('Gagal memuat katalog suara', true);
        }
      } catch (err) {
        showToast('Koneksi server gagal', true);
      }
    }

    // Render Grid
    function renderGrid() {
      const filtered = sounds.filter(s => {
        const matchCat = (activeCategory === 'all' || s.category === activeCategory);
        const matchQuery = s.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                           s.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        containerEl.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 24px; color: #64748b; font-size: 12px; font-family: 'JetBrains Mono', monospace;">
            TIDAK ADA SUARA YANG COCOK
          </div>
        `;
        return;
      }

      containerEl.innerHTML = filtered.map(s => `
        <div class="sound-card ${currentPlayingId === s.id ? 'playing' : ''}" id="card-${s.id}">
          <div class="sound-top">
            <span class="sound-badge">${s.badge}</span>
            <span class="sound-duration">${s.durationSeconds.toFixed(1)}s</span>
          </div>
          <div>
            <div class="sound-title">${s.title}</div>
            <div class="sound-desc">${s.description}</div>
          </div>
          <div class="sound-actions">
            <button class="btn-preview ${currentPlayingId === s.id ? 'active' : ''}" onclick="togglePlay('${s.id}')">
              <span>${currentPlayingId === s.id ? 'STOP' : 'PLAY'}</span>
            </button>
            <button class="btn-send-wa" onclick="sendToWhatsApp('${s.id}')" title="Kirim ke WhatsApp">
              <span>KIRIM VN</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    // Audio Playback with Web Audio Visualizer
    function stopPlayback() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      currentPlayingId = null;
      nowPlayingEl.textContent = 'IDLE';
      nowPlayingEl.style.color = '#1DB954';
      audioTimeEl.textContent = '0.0s / 0.0s';
      drawIdleWave();
      renderGrid();
    }

    function togglePlay(soundId) {
      if (currentPlayingId === soundId) {
        stopPlayback();
        return;
      }

      stopPlayback();
      const soundItem = sounds.find(s => s.id === soundId);
      if (!soundItem) return;

      currentPlayingId = soundId;
      nowPlayingEl.textContent = soundItem.title.toUpperCase();
      nowPlayingEl.style.color = '#38bdf8';
      renderGrid();

      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      const audio = new Audio('/api/soundboard/preview/' + soundId);
      audio.crossOrigin = "anonymous";
      currentAudio = audio;

      const source = audioContext.createMediaElementSource(audio);
      analyserNode = audioContext.createAnalyser();
      analyserNode.fftSize = 64;
      source.connect(analyserNode);
      analyserNode.connect(audioContext.destination);

      audio.ontimeupdate = () => {
        if (!currentAudio) return;
        const cur = audio.currentTime.toFixed(1);
        const dur = (audio.duration || soundItem.durationSeconds).toFixed(1);
        audioTimeEl.textContent = `${cur}s / ${dur}s`;
      };

      audio.onended = () => {
        stopPlayback();
      };

      audio.onerror = () => {
        showToast('Gagal memutar audio', true);
        stopPlayback();
      };

      audio.play().then(() => {
        startWaveLoop();
      }).catch(err => {
        showToast('Autoplay diblokir oleh browser', true);
        stopPlayback();
      });
    }

    // Canvas Waveform Animation
    function drawIdleWave() {
      const w = canvasEl.width;
      const h = canvasEl.height;
      canvasCtx.clearRect(0, 0, w, h);
      canvasCtx.fillStyle = '#10141d';
      canvasCtx.fillRect(0, 0, w, h);

      canvasCtx.strokeStyle = '#1e2638';
      canvasCtx.lineWidth = 1;
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, h / 2);
      canvasCtx.lineTo(w, h / 2);
      canvasCtx.stroke();
    }

    function startWaveLoop() {
      if (!analyserNode) return;
      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function renderFrame() {
        if (!currentPlayingId) return;
        animFrameId = requestAnimationFrame(renderFrame);

        analyserNode.getByteFrequencyData(dataArray);

        const w = canvasEl.width;
        const h = canvasEl.height;
        canvasCtx.clearRect(0, 0, w, h);
        canvasCtx.fillStyle = '#090b10';
        canvasCtx.fillRect(0, 0, w, h);

        const barWidth = (w / bufferLength) * 1.5;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * h * 0.85;

          const gradient = canvasCtx.createLinearGradient(0, h, 0, h - barHeight);
          gradient.addColorStop(0, '#1DB954');
          gradient.addColorStop(1, '#00F0FF');

          canvasCtx.fillStyle = gradient;
          canvasCtx.fillRect(x, h - barHeight, barWidth - 2, barHeight);

          x += barWidth;
        }
      }

      renderFrame();
    }

    // Send WhatsApp Voice Note (PTT)
    async function sendToWhatsApp(soundId) {
      const targetChat = targetChatEl.value.trim();
      if (!targetChat) {
        showToast('Tentukan destinasi JID WhatsApp di atas terlebih dahulu', true);
        targetChatEl.focus();
        return;
      }

      const card = document.getElementById('card-' + soundId);
      const btn = card ? card.querySelector('.btn-send-wa') : null;
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'MENGIRIM...';
      }

      try {
        const res = await fetch('/api/soundboard/send-wa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ soundId, chatJid: targetChat })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showToast('Voice Note berhasil dikirim ke WhatsApp!');
        } else {
          showToast(data.error || 'Gagal mengirim Voice Note', true);
        }
      } catch (err) {
        showToast('Koneksi ke bot terputus', true);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'KIRIM VN';
        }
      }
    }

    // Event Listeners
    searchEl.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderGrid();
    });

    document.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeCategory = chip.dataset.cat;
        renderGrid();
      });
    });

    // Start
    drawIdleWave();
    loadCatalog();
  </script>
</body>
</html>
