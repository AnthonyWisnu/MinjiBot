<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spin the Wheel // MinjiBot Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      background-color: #0b0d12;
      background-image: radial-gradient(circle at 50% 0%, #17241c 0%, #0b0d12 65%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px 12px 60px 12px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .card {
      width: 100%;
      background: #141822;
      border: 1px solid #232a39;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: #1DB954;
      letter-spacing: 1px;
      font-family: 'JetBrains Mono', monospace;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* Wheel Container */
    .wheel-stage {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#wheel-canvas {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(29, 185, 84, 0.3), 0 0 10px rgba(0,0,0,0.8);
    }
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ef4444;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
      z-index: 10;
    }
    .center-hub {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #0e1219;
      border: 3px solid #1DB954;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: #1DB954;
      box-shadow: 0 0 14px rgba(29, 185, 84, 0.5);
      z-index: 5;
    }

    /* Action Button */
    .btn-spin {
      width: 100%;
      background: #1DB954;
      border: none;
      color: #0b0d12;
      font-size: 14px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(29, 185, 84, 0.4);
      transition: all 0.15s;
    }
    .btn-spin:hover { background: #1ed760; }
    .btn-spin:active { transform: scale(0.97); }
    .btn-spin:disabled {
      background: #273142;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Target Chat & User JID inputs */
    .target-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #0d1118;
      border: 1px solid #1e2637;
      border-radius: 10px;
      padding: 8px 12px;
      text-align: left;
    }
    .target-label {
      font-size: 10px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }
    .target-input {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      outline: none;
    }

    /* Claim Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 10, 15, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: #151a24;
      border: 1px solid #1DB954;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
    .prize-title {
      font-size: 24px;
      font-weight: 800;
      color: #1DB954;
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-modal {
      background: #1DB954;
      border: none;
      color: #0b0d12;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Nav */
    .comm-nav {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .comm-link {
      flex: 1;
      background: #141822;
      border: 1px solid #232a39;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
    }
    .comm-link.active {
      border-color: #1DB954;
      color: #1DB954;
      background: #0e2014;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #161c27;
      border: 1px solid #1DB954;
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand-sub">LUCKY DRAW // COMMUNITY</div>
      <div class="brand-title">Roda Keberuntungan</div>
      <p style="font-size: 11px; color: #94a3b8;">
        Putar roda keberuntungan untuk memenangkan Points saldo atau XP leveling!
      </p>

      <!-- Target User info -->
      <div class="target-box">
        <span class="target-label">WHATSAPP USER JID:</span>
        <input type="text" id="user-jid" class="target-input" placeholder="cth: 628xxx@s.whatsapp.net">
      </div>

      <!-- Wheel Stage -->
      <div class="wheel-stage">
        <div class="pointer"></div>
        <canvas id="wheel-canvas" width="600" height="600"></canvas>
        <div class="center-hub">SPIN</div>
      </div>

      <button class="btn-spin" id="btn-spin" onclick="spinWheel()">PUTAR SEKARANG</button>
    </div>

    <!-- Nav Switcher -->
    <div class="comm-nav">
      <a href="/community/leaderboard" class="comm-link">LEADERBOARD</a>
      <a href="/community/spin" class="comm-link active">SPIN THE WHEEL</a>
      <a href="/arcade" class="comm-link">ARCADE ZONE</a>
    </div>
  </div>

  <!-- Win Modal -->
  <div class="modal-overlay" id="win-modal">
    <div class="modal-card">
      <div style="font-size: 11px; color: #94a3b8; font-family: 'JetBrains Mono', monospace;">HADIAH ANDA</div>
      <div class="prize-title" id="modal-prize-title">50 POINTS</div>
      <p style="font-size: 12px; color: #cbd5e1;" id="modal-prize-desc">Hadiah telah siap ditukarkan ke akun Anda.</p>
      <button class="btn-modal" onclick="claimPrize()">KLAIM KE AKUN BOT</button>
      <button style="background:transparent;border:none;color:#64748b;font-size:11px;cursor:pointer;" onclick="closeModal()">Tutup</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const SECTORS = [
      { label: "50 POINTS", color: "#10b981", textColor: "#ffffff", key: "50PTS" },
      { label: "100 XP", color: "#3b82f6", textColor: "#ffffff", key: "100XP" },
      { label: "150 POINTS", color: "#f59e0b", textColor: "#0b0d12", key: "150PTS" },
      { label: "ZONK", color: "#475569", textColor: "#ffffff", key: "ZONK" },
      { label: "200 XP", color: "#8b5cf6", textColor: "#ffffff", key: "200XP" },
      { label: "300 POINTS", color: "#ec4899", textColor: "#ffffff", key: "300PTS" },
      { label: "JACKPOT 500", color: "#eab308", textColor: "#0b0d12", key: "JACKPOT" },
      { label: "250 XP", color: "#06b6d4", textColor: "#0b0d12", key: "250XP" },
    ];

    const canvas = document.getElementById("wheel-canvas");
    const ctx = canvas.getContext("2d");
    const numSectors = SECTORS.length;
    const arc = (2 * Math.PI) / numSectors;

    let currentAngle = 0;
    let isSpinning = false;
    let wonSector = null;

    // Audio SFX
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playTick() {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = 800;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function playWinSfx() {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = 587;
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = "show";
      setTimeout(() => { toast.className = ""; }, 3500);
    }

    // Parse URL params
    const urlParams = new URLSearchParams(window.location.search);
    const userFromUrl = urlParams.get("user");
    if (userFromUrl) document.getElementById("user-jid").value = userFromUrl;

    function drawWheel() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = cx - 12;

      ctx.clearRect(0, 0, w, h);

      for (let i = 0; i < numSectors; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = SECTORS[i].color;
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, angle, angle + arc);
        ctx.lineTo(cx, cy);
        ctx.fill();

        ctx.strokeStyle = "#141822";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Label
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = SECTORS[i].textColor;
        ctx.font = "bold 20px 'JetBrains Mono', monospace";
        ctx.fillText(SECTORS[i].label, radius - 24, 6);
        ctx.restore();
      }
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById("btn-spin").disabled = true;

      // Random target sector
      const targetSectorIdx = Math.floor(Math.random() * numSectors);
      wonSector = SECTORS[targetSectorIdx];

      // Calculate final angle to land on targetSectorIdx at pointer (pointing at top = 3*PI/2)
      const fullRotations = 6;
      const targetSliceCenter = targetSectorIdx * arc + arc / 2;
      const pointerAngle = (3 * Math.PI) / 2;
      const targetFinalAngle = pointerAngle - targetSliceCenter;

      const totalRotation = fullRotations * 2 * Math.PI + ((targetFinalAngle - (currentAngle % (2 * Math.PI))) + 2 * Math.PI) % (2 * Math.PI);

      const startAngle = currentAngle;
      const startTime = performance.now();
      const durationMs = 4500;
      let lastTickAngle = currentAngle;

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / durationMs);

        // Ease-out cubic easing
        const ease = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotation * ease;

        // Sound clicks
        if (Math.abs(currentAngle - lastTickAngle) >= arc / 2) {
          playTick();
          lastTickAngle = currentAngle;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById("btn-spin").disabled = false;
          playWinSfx();
          showWinModal(wonSector);
        }
      }

      requestAnimationFrame(animate);
    }

    function showWinModal(sector) {
      document.getElementById("modal-prize-title").textContent = sector.label;
      document.getElementById("win-modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("win-modal").classList.remove("active");
    }

    async function claimPrize() {
      if (!wonSector) return;
      const userJid = document.getElementById("user-jid").value.trim();
      const token = "SPIN-" + wonSector.key + "-" + Math.floor(Date.now() / 1000).toString(16);

      try {
        const res = await fetch("/api/arcade/claim-reward", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token,
            userJid: userJid || "user@s.whatsapp.net",
            groupJid: urlParams.get("group") || "group@g.us"
          })
        });

        const data = await res.json();
        closeModal();
        if (data.success) {
          showToast(data.message || "Hadiah berhasil diklaim!");
        } else {
          showToast(data.error || "Gagal mengklaim hadiah", true);
        }
      } catch (e) {
        closeModal();
        showToast("Token Anda: " + token + " (Kirim ke bot)");
      }
    }

    drawWheel();
  </script>
</body>
</html>
