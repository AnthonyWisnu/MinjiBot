# MinjiBot Web Mini-App Suite Reverse Proxy Configuration
# VPS Tencent Cloud / Nginx Reverse Proxy
# Domain example: play.anthonywj.my.id -> localhost:3004

server {
    listen 80;
    server_name play.anthonywj.my.id;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name play.anthonywj.my.id;

    # SSL Certificate Configuration (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/play.anthonywj.my.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/play.anthonywj.my.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max body size for avatar and audio uploads
    client_max_body_size 20M;

    # Web Player, Meme Soundboard, Retro Arcade, Dans Catur, Community Suite
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;

        # WebSocket & Long-polling support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering to ensure low RAM footprint & zero latency for audio/video stream chunks
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
