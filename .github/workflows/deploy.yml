name: Deploy MinjiBot

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps-minjibot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Tencent Lighthouse VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          port: 22
          script: |
            (
              flock -x -w 300 200 || { echo "ERROR: Deployment lain sedang berjalan di server (timeout 300 detik tercapai)"; exit 1; }

              set -e
              export PATH="/usr/local/bin:/usr/bin:$PATH"

              cd /home/anthony/MinjiBot

              # Bersihkan stale lock Git jika ada proses sebelumnya yang terhenti
              rm -f .git/index.lock

              echo "=== 1. Mengambil pembaruan branch main ==="
              git fetch origin main
              git reset --hard origin/main

              echo "=== 2. Memperbarui dependensi NPM ==="
              npm ci || npm install

              echo "=== 3. Menjalankan sinkronisasi database Prisma ==="
              npx prisma generate
              npx prisma db push --skip-generate --accept-data-loss

              echo "=== 4. Kompilasi TypeScript ==="
              npm run build

              echo "=== 5. Memuat ulang proses bot di PM2 ==="
              pm2 describe minjibot > /dev/null \
                && pm2 restart minjibot --update-env \
                || pm2 start dist/index.js --name minjibot

              pm2 save
              echo "=== Deployment MinjiBot Selesai dengan Sukses ==="
            ) 200>/tmp/minjibot_deploy.lock
