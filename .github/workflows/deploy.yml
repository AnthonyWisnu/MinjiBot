name: Deploy MinjiBot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Tencent Lighthouse VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          port: 22
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:$PATH"

            cd /home/anthony/MinjiBot
            git fetch origin main
            git pull --ff-only origin main

            npm ci || npm install
            npx prisma generate
            npx prisma db push --skip-generate || npm run prisma:deploy
            npm run build

            pm2 describe minjibot > /dev/null \
              && pm2 restart minjibot --update-env \
              || pm2 start dist/index.js --name minjibot

            pm2 save
